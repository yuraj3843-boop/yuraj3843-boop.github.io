<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정유라 | 프로필</title>

  <!-- 웹 폰트 (Pretendard: 모바일과 PC 모두에서 깔끔하게 보이는 한글 폰트) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    /* ==========================================================
       [디자인 스타일 설정]
       화사하고 산뜻한 파스텔톤 컬러와 모바일 맞춤 디자인입니다.
    ========================================================== */
    :root {
      --bg-gradient-start: #fbf5f3; /* 부드러운 살구빛 파스텔 */
      --bg-gradient-end: #edf2fb;   /* 은은한 하늘빛 파스텔 */
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-sub: #718096;
      --primary-pastel: #ffccd5;    /* 파스텔 핑크 */
      --primary-hover: #ffb3c1;
      --secondary-pastel: #e2eafc;  /* 파스텔 블루 */
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, #f6e6ec 50%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      color: var(--text-main);
    }

    /* 모바일/PC 공통 카드 컨테이너 */
    .profile-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 24px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 프로필 사진 영역 */
    .photo-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09);
      background-color: #f7fafc;
      transition: transform 0.3s ease;
    }

    .profile-photo:hover {
      transform: scale(1.04);
    }

    /* 이름 & 한 줄 소개 영역 */
    .profile-name {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .profile-bio {
      font-size: 0.96rem;
      color: var(--text-sub);
      line-height: 1.55;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    /* 링크 버튼 목록 */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.98rem;
      transition: all 0.25s ease;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .link-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .instagram-icon {
      color: #d62976;
      background: #fdf2f4;
    }

    .xhs-icon {
      background: #fff0f2;
    }

    .email-icon {
      color: #475569;
      background: #f1f5f9;
    }

    .link-item:hover .link-icon {
      transform: scale(1.08);
    }

    .link-arrow {
      color: #a0aec0;
      font-size: 1.1rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    /* 링크 버튼에 마우스 올렸을 때(호버) & 터치 효과 */
    .link-item:hover, .link-item:active {
      background: #ffffff;
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
    }

    .link-item:hover .link-arrow {
      color: var(--text-main);
      transform: translateX(3px);
    }

    /* 하단 안내 텍스트 */
    .footer-note {
      font-size: 0.8rem;
      color: #a0aec0;
    }

  </style>
</head>
